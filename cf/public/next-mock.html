<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unwall next steps (mock)</title>
<style>
:root { --bg: #f6f4ee; --ink: #1f1e1b; --muted: #6f6b62; --line: #e2ded2; --bubble: #e9e5d9; --accent: #c96442; --card: #fffdf8; --ok: #3f7d4e; --warn: #b7791f; }
@media (prefers-color-scheme: dark) { :root { --bg: #1f1e1c; --ink: #ece9e1; --muted: #a39e93; --line: #34332e; --bubble: #2b2a26; --card: #262522; --ok: #6fbf80; --warn: #e0b04a; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 15px/1.6 Geist, system-ui, sans-serif; }
.app { max-width: 720px; margin: 0 auto; padding: 0 16px 24px; display: flex; flex-direction: column; min-height: 100dvh; }
header { padding: 16px 0 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h1 { font: 500 20px/1.2 Georgia, serif; margin: 0; flex: 1; }
h1 small { font: 12px system-ui; color: var(--muted); margin-left: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 32px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tab[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
#body { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
.thread-head { font: 500 18px/1.3 Georgia, serif; }
.meta { font-size: 13px; color: var(--muted); margin-top: -8px; }
.you { align-self: flex-end; max-width: 80%; background: var(--bubble); padding: 9px 15px; border-radius: 16px; white-space: pre-line; }
.claude p { margin: 0 0 10px; } .claude ul { margin: 0 0 10px; padding-left: 20px; }
.q { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; animation: in .2s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px) } }
@media (prefers-reduced-motion: reduce) { .q { animation: none } }
.q .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--warn); font-weight: 600; }
.q .ask { font-weight: 500; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { min-height: 40px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 9px 12px; font: inherit; cursor: pointer; }
.opt:hover, .opt.on { border-color: var(--accent); }
.opt .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 50%; flex: none; margin-top: 3px; display: grid; place-items: center; font-size: 12px; color: #fff; }
.multi .opt .box { border-radius: 5px; }
.opt.on .box { background: var(--accent); border-color: var(--accent); }
.opt b { font-weight: 500; display: block; }
.opt small { color: var(--muted); font-size: 13px; display: block; }
.rec { font-size: 11px; color: var(--ok); margin-left: 6px; font-weight: 500; }
.preview { border-left: 3px solid var(--accent); padding: 6px 10px; font-size: 14px; white-space: pre-line; background: var(--bg); border-radius: 0 8px 8px 0; }
.preview:empty { display: none; }
.done { font-size: 13px; color: var(--muted); }
form { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; position: sticky; bottom: 12px; }
.to { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 8px; display: flex; justify-content: space-between; }
.to:empty { display: none; }
.to button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
form .r { display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; border: 0; background: none; color: var(--ink); font: inherit; resize: none; outline: none; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Unwall <small>mock: next steps</small></h1>
    <div class="tabs" role="group" aria-label="Kind of question">
      <button class="tab" data-kind="next" aria-pressed="true">Next step</button>
      <button class="tab" data-kind="one" aria-pressed="false">Pick one</button>
      <button class="tab" data-kind="many" aria-pressed="false">Pick many</button>
    </div>
  </header>
  <div id="body"></div>
  <p class="note">Mock on fake data. Nothing is sent anywhere.</p>
  <form id="f">
    <div class="to" id="to"></div>
    <div class="r"><textarea id="input" rows="1" placeholder="Say anything. It goes to the right thread."></textarea><button class="btn primary">Send</button></div>
  </form>
</div>
<script>
const $ = id => document.getElementById(id), esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const QS = {
  next: {kind: 'Next step', ask: 'Start the posting plan for the groups where posting is OK?',
    options: [{label: 'Start it'}, {label: 'Hold for now'}]},
  one: {kind: 'Pick one', ask: 'Which post goes to the Pune Startups WhatsApp group?',
    options: [
      {label: 'Short invite', note: '2 lines and the link', rec: true, preview: 'Building something in Pune and tired of working alone?\nWe\'re picking a house together. Vote for one: topc.social/house'},
      {label: 'Question first', note: 'Asks before it pitches', preview: 'Where do Pune builders actually work together, not side by side?\nWe\'re trying a house for it: topc.social/house'},
      {label: 'Photo + one line', note: 'A house photo and the link', preview: '[photo: Talera Park villa]\nThis could be Pune\'s builders\' house. Vote: topc.social/house'}]},
  many: {kind: 'Pick many', ask: 'Which groups should get the post this week?',
    options: [
      {label: 'TOPC Meetup', note: 'Ours, posting is fine', rec: true},
      {label: 'Pune Startups WhatsApp', note: 'Rules allow it'},
      {label: 'Circle & Co.', note: 'Wednesdays only'},
      {label: 'r/punemeetup', note: 'Allowed, low traffic'},
      {label: 'eChai Pune', note: 'Ask the admin first'}]},
};
let kind = 'next', target = null, said = [], picked = new Set(), focus = 0;

function draw() {
  const q = QS[kind], multi = kind === 'many';
  const opts = kind === 'next'
    ? `<div class="row">${q.options.map((o, i) => `<button class="btn${i ? '' : ' primary'}" data-send="${esc(o.label)}">${esc(o.label)}</button>`).join('')}<button class="btn" data-other>Other…</button></div>`
    : `<div class="${multi ? 'multi' : ''}" style="display:flex;flex-direction:column;gap:6px">${q.options.map((o, i) => `<button class="opt${picked.has(i) ? ' on' : ''}" data-i="${i}" aria-pressed="${picked.has(i)}"><span class="box">${picked.has(i) ? '✓' : ''}</span><span><b>${esc(o.label)}${o.rec ? '<span class="rec">Recommended</span>' : ''}</b><small>${esc(o.note)}</small></span></button>`).join('')}
       <button class="opt" data-other><span class="box"></span><span><b>Other…</b><small>Type your own answer</small></span></button></div>
       <div class="preview" id="pv">${q.options[focus]?.preview ? esc(q.options[focus].preview) : ''}</div>
       <div class="row"><button class="btn primary" id="go" ${picked.size ? '' : 'disabled'}>${multi ? `Send ${picked.size || ''}` : 'Send'}</button></div>`;
  $('body').innerHTML = `
    <div class="thread-head">TOPC House</div><div class="meta">Done · ~/dev/topc on your Mac</div>
    <div class="claude"><p>The pledge form works end to end now, and your pledge is the first real one in the table.</p>
    <ul><li><b>Groups mapped:</b> 4 allow posting, 5 need an admin's yes first.</li><li><b>Drafts:</b> the CMO wrote 3, the checker passed them.</li></ul></div>
    ${said.map(s => `<div class="you">${esc(s)}</div>`).join('')}
    ${said.length ? '<div class="done">Sent to TOPC House. In the real app the thread picks it up from here.</div>'
      : `<div class="q"><span class="k">${q.kind}</span><span class="ask">${esc(q.ask)}</span>${opts}</div>`}`;
}
function send(text) { said.push(text); picked.clear(); draw() }

document.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (t) { kind = t.dataset.kind; said = []; picked.clear(); focus = 0; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b === t)); return draw() }
  const s = e.target.closest('[data-send]'); if (s) return send(s.dataset.send);
  if (e.target.closest('[data-other]')) { target = 'TOPC House'; $('to').innerHTML = `<span>→ <b>${target}</b> · your own answer</span><button type="button" id="untarget" aria-label="Stop">×</button>`; $('input').focus(); return }
  if (e.target.id === 'untarget') { target = null; $('to').innerHTML = ''; return }
  const o = e.target.closest('.opt[data-i]'); if (o) { const i = +o.dataset.i; focus = i;
    if (kind === 'many') picked.has(i) ? picked.delete(i) : picked.add(i); else { picked.clear(); picked.add(i) }
    return draw() }
  if (e.target.id === 'go') { const q = QS[kind]; send([...picked].sort().map(i => q.options[i].label).join(kind === 'many' ? ', ' : '')) }
});
$('f').onsubmit = e => { e.preventDefault(); const v = $('input').value.trim(); if (!v) return; $('input').value = '';
  if (target) { send(v); target = null; $('to').innerHTML = '' } else alert('In the real app this goes to the router.') };
draw();
</script>
</body>
</html>
