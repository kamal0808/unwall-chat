<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unwall Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap">
<style>
:root {
  --bg: #f6f4ee; --side: #efece3; --ink: #1f1e1b; --muted: #77736a; --line: #e2ded2;
  --bubble: #e9e5d9; --accent: #c96442; --card: #fffdf8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1f1e1c; --side: #191917; --ink: #ece9e1; --muted: #9b968b; --line: #2f2e2a; --bubble: #2b2a26; --card: #262522; }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: 264px 1fr; background: var(--bg); color: var(--ink); font: 15px/1.6 Geist, system-ui, sans-serif; }
aside { background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
.brand { font: 600 19px Newsreader, Georgia, serif; padding: 6px 10px 14px; }
.brand b { color: var(--accent); font-weight: 600; }
.new { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 12px; text-align: left; font: inherit; cursor: pointer; margin-bottom: 10px; }
.label { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; }
.chat { display: block; width: 100%; border: 0; background: none; color: var(--ink); text-align: left; font: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat:hover { background: var(--bubble); }
.chat.on { background: var(--bubble); font-weight: 500; }
main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.top { padding: 14px 24px; border-bottom: 1px solid var(--line); font-weight: 500; }
.thread { flex: 1; overflow: auto; padding: 28px 24px 40px; }
.msg { max-width: 760px; margin: 0 auto 28px; }
.user { display: flex; justify-content: flex-end; }
.user p { background: var(--bubble); padding: 10px 16px; border-radius: 16px; margin: 0; max-width: 85%; }
.plain { font: 17px/1.65 Newsreader, Georgia, serif; }
.plain code { font-size: 14px; background: var(--bubble); padding: 1px 5px; border-radius: 5px; }
.wall { max-width: 1100px; }
.wall iframe { width: 100%; height: 82vh; border: 1px solid var(--line); border-radius: 18px; background: var(--card); display: block; }
.wall .meta { font-size: 12px; color: var(--muted); margin: 0 0 8px 4px; }
.composer { padding: 0 24px 22px; }
.composer form { max-width: 760px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-end; box-shadow: 0 2px 10px #0000000d; }
.composer textarea { flex: 1; border: 0; background: none; color: var(--ink); font: inherit; resize: none; outline: none; max-height: 200px; }
.composer button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 7px 14px; font: inherit; cursor: pointer; }
.composer button:disabled { opacity: .5; cursor: default; }
.tools { font-size: 12px; color: var(--muted); margin: 0 0 8px 4px; }
.live { white-space: pre-wrap; }
.err { color: var(--accent); }
@media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<aside>
  <div class="brand">Unwall <b>Chat</b></div>
  <button class="new" onclick="openChat(null)">+ New chat</button>
  <div class="label">Recents</div>
  <nav id="chats"></nav>
</aside>
<main>
  <div class="top" id="title"></div>
  <div class="thread" id="thread"></div>
  <div class="composer"><form id="form"><textarea id="input" rows="1" placeholder="Reply to Claude…" autofocus></textarea><button id="sendBtn">Send</button></form></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const LONG = 150;
const $ = id => document.getElementById(id);
const words = s => (s.match(/\S+/g) || []).length;
const b64u = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(o).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') };
const esc = s => s.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let current = null, busy = false;

function toolsLine(tools) {
  if (!tools.length) return '';
  const names = [...new Set(tools)];
  return `<p class="tools">Used ${tools.length} tool${tools.length > 1 ? 's' : ''}: ${esc(names.join(', '))}</p>`;
}
function turnHtml(t) {
  if (t.role === 'user') return `<div class="msg user"><p>${esc(t.text)}</p></div>`;
  const html = DOMPurify.sanitize(marked.parse(t.text || ''));
  if (words(t.text) < LONG) return `<div class="msg plain">${toolsLine(t.tools)}${html}</div>`;
  // Unwall's bookmarklet entry point: base64 HTML in #add=, it converts and opens the digest
  return `<div class="msg wall">${toolsLine(t.tools)}<p class="meta">${words(t.text).toLocaleString()} words, unwalled</p><iframe src="unwall.html#add=${b64u(html)}" title="Claude's answer, unwalled"></iframe></div>`;
}
const scrollEnd = () => { const t = $('thread'); t.scrollTop = t.scrollHeight };

async function loadChats() {
  const chats = await (await fetch('/api/chats')).json();
  $('chats').innerHTML = chats.map(c => `<button class="chat${c.id === current ? ' on' : ''}" onclick="openChat('${c.id}')" title="${esc(c.title)}">${esc(c.title)}</button>`).join('');
}
async function openChat(id) {
  if (busy) return;
  current = id;
  document.querySelectorAll('.chat').forEach(b => b.classList.toggle('on', b.getAttribute('onclick') === `openChat('${id}')`));
  $('thread').innerHTML = '';
  $('title').textContent = id ? document.querySelector('.chat.on')?.title || '' : 'New chat';
  if (id) { $('thread').innerHTML = (await (await fetch('/api/chats/' + id)).json()).map(turnHtml).join(''); scrollEnd() }
  $('input').focus();
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || busy) return;
  busy = true; $('sendBtn').disabled = true; $('input').value = '';
  $('thread').insertAdjacentHTML('beforeend', turnHtml({role: 'user', text}) + '<div class="msg plain live" id="live"><p class="tools" id="liveTools">Thinking…</p><div id="liveText"></div></div>');
  scrollEnd();
  const turn = {role: 'claude', text: '', tools: []};
  try {
    const res = await fetch('/api/send', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({text, sessionId: current})});
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines.filter(Boolean)) {
        const ev = JSON.parse(l);
        if (ev.type === 'session') current = ev.id;
        if (ev.type === 'text') turn.text += ev.delta;
        if (ev.type === 'break' && turn.text && !turn.text.endsWith('\n\n')) turn.text += '\n\n';
        if (ev.type === 'tool') turn.tools.push(ev.name);
        if (ev.type === 'error') turn.text += `\n\n**Error:** ${ev.message}`;
      }
      $('liveTools').textContent = turn.tools.length ? `Working… used ${turn.tools.length} tools: ${[...new Set(turn.tools)].join(', ')}` : 'Thinking…';
      $('liveText').textContent = turn.text;
      scrollEnd();
    }
  } catch (err) { turn.text += `\n\n**Error:** ${err.message}` }
  turn.text = turn.text.trim();
  $('live').outerHTML = turnHtml(turn);
  scrollEnd();
  busy = false; $('sendBtn').disabled = false;
  await loadChats();
  $('title').textContent = document.querySelector('.chat.on')?.title || $('title').textContent;
};
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit() } };

loadChats().then(() => openChat(null));
</script>
</body>
</html>
